// autoexec-arm64.cfg - per-ARCH baseline for Apple Silicon (arm64).
// macOS 11 Big Sur and later.
//
// This is the only slice in the fat that does not link a real SDL 1.2. There is
// no arm64 build of it and there never will be, so this slice links
// sdl12-compat, which reimplements the 1.2 API on top of a real SDL2 that we
// build and ship ourselves. dyld picks the slice by CPU alone, so PowerPC and
// Intel are untouched by that and keep the genuine SDL 1.2. docs/adr/0017.
//
// BENCHED, on the orchestration Mac (Apple M5, macOS 26, GL 2.1 Metal - 90.5),
// demo four, median of three runs. This is the one slice whose numbers come
// from the machine it was written for rather than from a near neighbour.
//
// Every setting below is at or near maximum because there is nothing to save:
// 1710x1107 all-on measured 715 fps, and 2560x1440 with 16x anisotropic and 4x
// multisample measured 485 fps. The floor case for this slice is the slowest
// Apple Silicon Mac, an M1 Air, which is far above what this renderer needs.

// Display ----------------------------------------------------------
// r_mode -2 is "use the desktop resolution", handled in sdl_glimp.c:252 before
// R_GetModeInfo is consulted. It is right here and wrong for the older slices:
// Apple Silicon Macs ship a dozen different panels, so a hardcoded WxH would be
// letterboxed or scaled on most of them. Verified live: picked 1710x1107.
seta r_mode "-2"
seta r_fullscreen "1"
seta r_customPixelAspect "1"

// Texture & fill ---------------------------------------------------
seta r_picmip "0"                     // full-size textures, unlike every other slice
seta r_texturebits "32"
seta r_colorbits "32"
seta r_depthbits "24"
seta r_stencilbits "8"
seta r_ext_compressed_textures "0"    // 0 not 1: compression exists to save VRAM we
                                      // are not short of, and it is lossy
seta r_ext_texture_filter_anisotropic "1"
seta r_ext_max_anisotropy "16"
seta r_textureMode "GL_LINEAR_MIPMAP_LINEAR"   // trilinear, not the default bilinear
seta r_ext_multisample "4"

// Geometry ---------------------------------------------------------
seta r_subdivisions "1"               // finest curve tessellation the engine allows
seta r_lodbias "0"
seta r_lodCurveError "10000"          // hold full curve detail at distance

// Lighting ---------------------------------------------------------
seta r_dynamiclight "1"               // ON here; the PowerPC and GMA slices cannot afford it
seta r_dlightBacks "1"
seta r_flares "1"
seta r_fastsky "0"                    // real sky. If this ever needs to go, use 2 and
                                      // NOT 1: tr_main.c:969 gates portals and mirrors
                                      // on an exact r_fastsky == 1, while the fill
                                      // savings are truthy tests, so 1 silently costs
                                      // every reflection in the game
seta r_drawSun "1"
seta cg_shadows "1"
seta r_finish "0"

seta com_maxfps "0"
seta cg_drawfps "0"                  // OFF in shipped builds. The counter is a
                                     // development readout, not a game feature, and a
                                     // release should not open with debug text on screen.
                                     // Turn it on per-session with /cg_drawfps 1.
seta cg_lagometer "0"

// Game modules: NATIVE arm64 dylibs, not the QVM.
//
// This slice has no bytecode JIT. vm_powerpc.c and vm_x86.c cover the other
// slices; there is no arm64 backend in this baseline, so a QVM here runs on the
// plain interpreter, which the engine says out loud ("Architecture doesn't have
// a bytecode compiler, using interpreter"). Native dylibs skip that entirely.
//
// Measured, median of three: native 875 fps, interpreted QVM 830 fps. That gap
// is small only because demo four is renderer-bound at these rates; the module
// cost is a fixed CPU charge per frame that a bot-heavy game would feel more.
//
// Loading these AT ALL needed an engine fix. The stock engine calls vmMain
// through a variadic pointer while every module defines it with named int
// parameters, which agrees on x86_64 and PowerPC and does not on Apple arm64.
// See qcommon.h and docs/adr/0017.
seta vm_cgame "0"
seta vm_game "0"
seta vm_ui "0"

seta s_khz "44"
seta com_hunkMegs "256"
