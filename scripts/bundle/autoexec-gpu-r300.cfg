// GPU tier: ATI R300 family (Radeon 9500-9800, X300-X850), 128 MB+, on a G5.
// Selected at runtime from the CGL renderer ID, VRAM and hw.cpusubtype
// (Com_GpuTierConfig, #62), not from hw.model, so a G5 tower the model map does
// not know gets the settings its GPU can carry. Applied after the per-arch
// baseline and before any hw.model overlay; every cvar here is also set by
// autoexec-imac-g5.cfg, so the iMac G5 is unchanged.
//
// Measured on g5-tiger (G5 Dual 2.7, Radeon 9600, Tiger), 1680x1050, demo four,
// 3 interleaved rounds each (2026-09-23):
//   G4 baseline it had before               114.0 114.0 118.1 fps
//   these settings without FSAA              81.6  81.6  81.7
//   these settings, 2x FSAA (SHIPPED)        47.0  47.2  47.5
//   these settings, 4x FSAA (rejected)       27.3  27.4  27.6
// The G5 has no fps floor and effects beat fps, so the frames go on full
// texture resolution, finer curves, full model LOD, flares, 16x aniso,
// trilinear and 2x FSAA; the same trade the iMac G5 ships (34.5 fps).
seta r_picmip "0"
seta r_subdivisions "1"
seta r_lodCurveError "10000"
seta r_lodbias "0"
seta r_dynamiclight "1"
seta r_flares "1"
seta cg_shadows "1"
seta r_ext_compressed_textures "1"
seta r_ext_texture_filter_anisotropic "1"
seta r_ext_max_anisotropy "16"
seta r_textureMode "GL_LINEAR_MIPMAP_LINEAR"
seta r_ext_multisample "2"
