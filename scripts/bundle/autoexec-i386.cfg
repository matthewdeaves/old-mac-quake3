// autoexec-i386.cfg - per-ARCH baseline for 32-bit-only Intel Macs.
// 10.4 Tiger through 10.6.8 Snow Leopard.
//
// This slice exists for exactly four machines, the only Intel Macs with no
// 64-bit mode: Mac mini 1,1, iMac 4,1, MacBook 1,1 and MacBook Pro 1,1, all
// 2006 Core Solo or Core Duo. dyld grades a fat by CPU subtype alone and
// never falls back, so without this slice those machines are handed nothing
// at all and the app does not launch.
//
// NOT BENCHED. There is no 32-bit-only Intel Mac in the fleet. Every value
// below comes from the part's documented capability and from mini-intel,
// which has the SAME GMA 950 GPU and so is the closest measured reference.
// The difference that drives everything here is the CPU: mini-intel is a
// 2.33 GHz Core 2 Duo, a Core Solo is one 1.5 GHz core. GPU-side settings
// carry over unchanged, CPU-side ones are trimmed.

seta r_mode "-1"
seta r_customwidth "800"              // below the x86_64 slice's 1024x768: the
seta r_customheight "600"             // GMA 950 has no hardware T&L, so the CPU
                                      // transforms every vertex, and on one core
                                      // that binds before fill rate does
seta r_fullscreen "1"
seta r_picmip "1"
seta r_texturebits "16"               // 16 not 32: the GMA 950 has no dedicated
seta r_colorbits "16"                 // VRAM, it borrows system memory, and these
seta r_depthbits "16"                 // machines shipped with as little as 512 MB
seta r_vertexlight "0"
seta r_subdivisions "8"               // coarser curve tessellation, CPU-side work
seta r_lodbias "1"                    // pull model LOD in one step
seta r_dynamiclight "0"               // fill-bound part, same call as the x86_64 baseline
seta r_flares "1"
seta r_fastsky "0"                    // real sky. If this ever needs to go, use 2
                                      // and NOT 1: tr_main.c:969 gates portals and
                                      // mirrors on an exact r_fastsky == 1, while
                                      // the fill savings are truthy tests, so 1
                                      // silently costs every reflection in the game
seta cg_shadows "1"
seta r_ext_compressed_textures "1"    // saves the scarce shared VRAM
seta r_ext_texture_filter_anisotropic "0"
seta com_maxfps "0"
seta cg_drawfps "1"
seta cg_lagometer "0"

// Game modules: QVM, NOT native dylibs, unlike every other slice here.
//
// This is deliberate and worth the note. The engine loads a native module by
// ARCH_STRING, so on this slice it would look for qagamei386.dylib, while
// ioquake3's Makefile names its output after $(ARCH), which for this target
// is "x86", giving qagamex86.dylib. The two names do not meet, so a native
// dylib would simply never be found and the engine would fall back to the
// QVM anyway, just after a failed lookup.
//
// Falling back deliberately costs little: the QVM has a real i386 JIT
// (vm_x86.c), the bytecode is CPU-independent and already ships inside
// pak8.pk3, and there is no hardware here to measure a dylib against.
seta vm_cgame "2"
seta vm_game "2"
seta vm_ui "2"

seta s_khz "22"                       // half-rate mix; the mixer shares the one core
seta com_hunkMegs "128"               // these machines shipped with 512 MB upward
