// imac-2019 - i5-9600K / Radeon Pro 580X 8 GB / Sequoia (modern reference)
// Max quality. This machine separates CPU-bound from GPU-bound effects across
// the GPU axis - it should never be the bottleneck on a stock Q3 load.
// Use the DESKTOP's own resolution (sdl_glimp.c:252 handles mode -2 before
// R_GetModeInfo is consulted). This can never be out of range, because the
// monitor is displaying that mode right now. A hardcoded size cannot promise
// that: this file used to name one, and on a cheap 1024x768 monitor the G4
// mini simply lost sync and reported "signal out of range", so the game could
// not be played at all. Reported from hardware 2026-08-21.
seta r_mode "-2"
// Kept as the fallback if the capture above cannot read the desktop.
seta r_customwidth "1920"
seta r_customheight "1080"
seta r_fullscreen "1"
seta r_picmip "0"
seta r_texturebits "32"
seta r_colorbits "32"
seta r_depthbits "24"
seta r_vertexlight "0"
seta r_subdivisions "4"
seta r_lodbias "0"
seta r_dynamiclight "1"
seta cg_shadows "1"
seta r_ext_compressed_textures "0"    // plenty of VRAM
seta r_ext_texture_filter_anisotropic "1"
seta r_ext_max_anisotropy "16"
// com_maxfps 125, NOT 0 (measured 2026-08-29, user report: "connection
// interrupted" icon + MAX_PACKET_USERCMDS console spam + broken movement
// against a real internet server, single player fine). Same mechanism as
// the arm64/quad-g5 configs: CG_DrawDisconnect (cg_draw.c) calls the link
// dead when the OLDEST usercmd still in the CMD_BACKUP-sized (64) ring is
// newer than the server's last acknowledgement. At this machine's uncapped
// framerate the ring wraps faster than a real internet round trip, so the
// check fires on a healthy connection. 125 is Q3's long-standing sane cap;
// costs nothing visible on a machine this fast.
seta com_maxfps "125"
seta cg_drawfps "0"                  // OFF in shipped builds. The counter is a
                                     // development readout, not a game feature, and a
                                     // release should not open with debug text on screen.
                                     // Turn it on per-session with /cg_drawfps 1.
// --- watchlink: Apple Watch "tactical computer" companion -----------------
// Auto-discover the iPhone/Watch companion over Bonjour and stream live vitals
// (health / armor / ammo / weapon / score / powerups) by UDP. Fully inert if
// no companion is found. Shared port + service with the Quake 1 / Quake 2 ports.
seta watch_host "auto"
seta watch_port "27999"
