// mini-intel - Core 2 Duo 2.33 GHz / GMA 950 / Lion 10.7.5
// Strong CPU, weak fill-limited GPU (GMA 950, GL 1.4, no GLSL, and only 64 MB
// of SHARED system memory for VRAM). Keep fill modest: dynamic lights off, no
// aniso, picmip 1. Lightmaps, shaders and flares stay on.
//
// 1920x1080, the panel's native mode. BENCHED at last, on 2026-08-20: three
// consecutive production-path runs of demo four gave 41.1 / 41.0 / 41.1 fps
// with the display healthy afterwards each time. That retires this file's old
// note, "native-res fps not yet bench-validated; if it dips, drop res first".
//
// It was briefly dropped to 1280x720 that same day on a WRONG diagnosis, and
// the reasoning is worth keeping so it is not repeated. Q3 appeared to hang the
// display here at 1080p: the machine kept running and ssh stayed responsive,
// but the screen went black and the GPU stack did not recover until a power
// cycle. The resolution was not the cause. The first run simply exceeded
// smoke-dmg.sh's then-fixed 90 second budget for this machine and was SIGKILLed
// mid-run, and every attempt after that inherited a wedged GPU, which looked
// exactly like a reproducible 1080p failure. After a reboot, 1080p passes every
// time. The timeout is now raisable with SMOKE_TIMEOUT.
//
// How to tell a wedged box from a merely idle one: system_profiler
// SPDisplaysDataType HANGS when the GPU stack is stuck, while uptime and ssh
// answer normally. Recovery is `ssh mini-intel sudo reboot`, which works here
// because this machine has passwordless sudo; the display comes back clean.
seta r_mode "-1"
seta r_customwidth "1920"
seta r_customheight "1080"
seta r_fullscreen "1"
seta r_picmip "1"
seta r_texturebits "32"
seta r_colorbits "32"
seta r_depthbits "24"
seta r_vertexlight "0"
seta r_subdivisions "4"
seta r_lodbias "0"
seta r_dynamiclight "0"               // GMA 950 fill-rate - keep dlights off
seta r_flares "1"
seta r_fastsky "0"
seta cg_shadows "1"
seta r_ext_compressed_textures "1"
seta r_ext_texture_filter_anisotropic "0"
seta r_swapInterval "1"               // vsync ON - GMA 950 tore badly at 1080p
seta com_maxfps "0"                   // vsync governs the cap; ~57 fps < 60 Hz
seta cg_drawfps "1"
seta cg_lagometer "0"
// --- watchlink: Apple Watch "tactical computer" companion -----------------
// Auto-discover the iPhone/Watch companion over Bonjour and stream live vitals
// (health / armor / ammo / weapon / score / powerups) by UDP. Fully inert if
// no companion is found. Shared port + service with the Quake 1 / Quake 2 ports.
seta watch_host "auto"
seta watch_port "27999"
