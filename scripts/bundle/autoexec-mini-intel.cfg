// mini-intel - Core 2 Duo 2.33 GHz / GMA 950 / Lion 10.7.5
// Strong CPU, weak fill-limited GPU (GMA 950, GL 1.4, no GLSL, and only 64 MB
// of SHARED system memory for VRAM). Keep fill modest: dynamic lights off, no
// aniso, picmip 1. Lightmaps, shaders and flares stay on.
//
// 1280x720, NOT the panel's native 1920x1080. This file used to ask for 1080p
// with the note "native-res fps not yet bench-validated; if it dips, drop res
// first". It does not dip. It HANGS THE DISPLAY: the machine keeps running and
// ssh stays responsive, but the screen goes black and stays black, and the GPU
// stack never recovers. It needed a physical power cycle. Reproduced twice on
// 2026-08-20, once on the production fullscreen path and once windowed, both
// stopping dead at "...setting mode -1: 1920 1080".
//
// Measured on the same machine, same build, immediately after:
//   640x480   windowed    59.5 fps, fine
//   1280x720  fullscreen  59.2 fps, fine, display healthy afterwards
// Both are at the 60 Hz vsync cap, so 720p costs nothing visible here anyway.
//
// 1680x1050 and 1600x900 are UNTESTED. Do not raise this without testing on
// the hardware, and expect to power-cycle the machine if it wedges again.
seta r_mode "-1"
seta r_customwidth "1280"
seta r_customheight "720"
seta r_fullscreen "1"
seta r_picmip "1"
seta r_texturebits "32"
seta r_colorbits "32"
seta r_depthbits "24"
seta r_vertexlight "0"
seta r_subdivisions "4"
seta r_lodbias "0"
seta r_dynamiclight "0"               // GMA 950 fill-rate - keep dlights off
seta r_flares "1"
seta r_fastsky "0"
seta cg_shadows "1"
seta r_ext_compressed_textures "1"
seta r_ext_texture_filter_anisotropic "0"
seta r_swapInterval "1"               // vsync ON - GMA 950 tore badly at 1080p
seta com_maxfps "0"                   // vsync governs the cap; ~57 fps < 60 Hz
seta cg_drawfps "1"
seta cg_lagometer "0"
// --- watchlink: Apple Watch "tactical computer" companion -----------------
// Auto-discover the iPhone/Watch companion over Bonjour and stream live vitals
// (health / armor / ammo / weapon / score / powerups) by UDP. Fully inert if
// no companion is found. Shared port + service with the Quake 1 / Quake 2 ports.
seta watch_host "auto"
seta watch_port "27999"
