// Macmini3,1, GeForce 9400 256 MB. Measured on Snow Leopard, 2026-09-22.
// Demo four at desktop 1920x1080, vsync off: richer textures and lighting
// average 119.2 fps across runs 2 and 3. See docs/PROFILING.md.
seta r_mode "-2"
seta r_fullscreen "1"
seta r_picmip "0"
seta r_texturebits "32"
seta r_colorbits "32"
seta r_depthbits "24"
seta r_vertexlight "0"
seta r_subdivisions "1"
seta r_lodCurveError "10000"
seta r_lodbias "0"
seta r_dynamiclight "1"
seta r_flares "1"
seta r_flareTestInterval "8"
seta r_fastsky "0"
seta cg_shadows "1"
seta r_ext_compressed_textures "1"
seta r_ext_texture_filter_anisotropic "1"
seta r_ext_max_anisotropy "8"
seta r_textureMode "GL_LINEAR_MIPMAP_LINEAR"
// 2x AA falls to 50.3 fps with this preset, below the Intel 60 fps floor.
seta r_ext_multisample "0"
seta com_maxfps "125"
seta cg_drawfps "0"
seta cg_lagometer "0"

// Expanded weapon effects, measured within budget on 2026-09-22.
seta cg_oldRail "0"       // spiral rail trail
seta cg_oldRocket "0"     // additional explosion particle effect
seta cg_oldPlasma "0"     // plasma trail particles
