// autoexec-ppc7400.cfg — per-ARCH baseline for ANY G4 (PPC 7400/7450, AltiVec).
// Applied to every G4 slice before the per-machine overlay. G4s have AltiVec
// (so the renderer + sound mixer use vectorized paths) and real GPUs, so this
// baseline is more generous than the G3's. The weakest G4 GPU in the fleet is
// the GeForce2 MX (sawtooth), so the fallback is tuned around that. Known G4s
// (sawtooth/quicksilver/mini-g4) overlay their GPU-specific values on top.
// Use the DESKTOP's own resolution (sdl_glimp.c:252 handles mode -2 before
// R_GetModeInfo is consulted). This can never be out of range, because the
// monitor is displaying that mode right now. A hardcoded size cannot promise
// that: this file used to name one, and on a cheap 1024x768 monitor the G4
// mini simply lost sync and reported "signal out of range", so the game could
// not be played at all. Reported from hardware 2026-08-21.
seta r_mode "-2"
// Kept as the fallback if the capture above cannot read the desktop.
seta r_customwidth "1024"
seta r_customheight "768"
seta r_fullscreen "1"
seta r_picmip "1"
seta r_texturebits "32"
seta r_colorbits "32"
seta r_depthbits "24"
seta r_vertexlight "0"               // lightmaps (AltiVec-friendly, real GPU)
seta r_subdivisions "8"
seta r_lodbias "1"
seta r_dynamiclight "1"
seta r_flares "0"
seta r_fastsky "0"
seta cg_shadows "1"
seta r_ext_compressed_textures "1"
seta r_ext_texture_filter_anisotropic "0"
seta com_maxfps "0"
seta cg_drawfps "0"                  // OFF in shipped builds. The counter is a
                                     // development readout, not a game feature, and a
                                     // release should not open with debug text on screen.
                                     // Turn it on per-session with /cg_drawfps 1.
// 3D HUD icons render fine on GeForce2/Radeon — leave them on (cg_draw3dIcons).
// Sound mixing is AltiVec-vectorized on the G4, so keep full-rate 22050 audio.
seta cg_lagometer "0"                // the net-graph box is ugly clutter; hide it
// Native game modules: load the fat ppc cgame/qagame/ui dylibs bundled in the
// .app (Contents/MacOS/baseq3) instead of JIT-compiling the pak8 QVM. The QVM is
// already JIT'd to native PPC, so this is a real-compiler-over-JIT + dropped-
// sandbox-masking win, bench-CONFIRMED +1.3% on quicksilver (41.10->41.65 fps,
// demo four @1680x1050, zero visual cost). Falls back to the QVM automatically if
// a dylib is missing/wrong-arch or on a pure server. See docs/PROFILING.md.
seta vm_cgame "0"
seta vm_game "0"
seta vm_ui "0"

// Re-test flare occlusion every 8th frame instead of every frame.
//
// Each flare visibility test is a 1-pixel glReadPixels of the depth buffer,
// which is a full GPU pipeline sync, and the FIRST one in a frame destroys
// CPU/GPU overlap for that whole frame. Thinning the tests within a frame does
// nothing (measured: capping 4 tests to 1 gave 24.7 vs 24.6 fps). Skipping
// whole frames is what pays.
//
// Measured on yosemite, demo four, 800x600 fullscreen:
//     interval 1 (upstream)   24.6 fps
//     interval 4              32.0 fps
//     interval 8              33.9 fps   <- shipped
//     flares off entirely     35.8 fps
//
// So this keeps the flares and recovers ~85% of what deleting them would buy.
// The only change is that a flare takes up to 8 frames to notice it has become
// occluded, against a fade r_flareFade already spreads over ~150ms.
seta r_flareTestInterval "8"
