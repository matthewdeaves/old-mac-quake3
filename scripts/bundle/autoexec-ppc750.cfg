// autoexec-ppc750.cfg - per-ARCH baseline for ANY G3 (PPC 750, no AltiVec).
// Applied by the in-engine auto-config (Com_AutoConfigForMachine) to every G3
// slice, BEFORE the per-machine overlay. This is the safe fallback for a G3 we
// don't have a specific profile for; known G3s (e.g. yosemite) then overlay
// their tuned values on top. Conservative on purpose - a 750 with a Rage-128-
// class GPU is the 1999 minimum spec. See docs/KNOBS.md, docs/PROFILING.md.
// DELIBERATELY not r_mode -2. Every other machine in this port takes the
// desktop's own resolution, which can never be out of range. The G3 cannot
// afford it: this part is fill-bound and the cost is close to linear in pixel
// count. Measured on yosemite, demo four, 2026-08-20:
//     640x480    20.8 fps
//     800x600    13.8 fps   <- shipped
//     1024x768    4.4 fps
// So if the desktop happens to be 1024x768, mode -2 would hand this machine a
// slideshow. A fixed, known-playable size is the right trade here and nowhere
// else.
seta r_mode "-1"
seta r_customwidth "640"
seta r_customheight "480"
seta r_fullscreen "1"
seta r_picmip "2"
seta r_texturebits "16"
seta r_colorbits "16"
seta r_depthbits "16"
seta r_vertexlight "1"               // vertex lighting; skip lightmaps

// r_primitives 3, the immediate-mode submission path, which auto-select will
// never choose: 0 resolves to 2 when GL_EXT_compiled_vertex_array is present,
// and the Rage 128 driver reports it.
//
// Measured on yosemite (Rage 128, 10.3.9, demo four, 800x600): 3 gives
// 33.3 fps against 31.7 for 2 and 31.3 for 1. The same A/B on a Radeon 9200
// goes the other way by 30%, so this belongs in the ppc750 baseline and NOT in
// the shared PowerPC one. Full table and method in autoexec-yosemite.cfg.
//
// The caveat, stated rather than hidden: this was measured on a Rage 128, the
// only ppc750-class GPU in this fleet. A G3 with a different card inherits it
// untested. If one ever turns up, A/B it before trusting this line.
seta r_primitives "3"

seta r_subdivisions "20"
seta r_lodbias "2"
seta r_dynamiclight "0"
seta r_flares "0"
seta r_fastsky "0"                   // REAL sky. 1 kills portals outright (tr_main.c:969 gates
                                     // them on an exact == 1); 2 dodges that gate but leaves the
                                     // portal BLACK, because the truthy test at tr_backend.c:448
                                     // clears the colour buffer to black for the portal's view
                                     // too. Measured on yosemite, demo four at 800x600: 13.7 fps
                                     // with 2 and black mirrors, 13.9 fps with 0 and correct
                                     // mirrors. The cheap sky saves nothing here. Issue #6.
seta cg_shadows "0"
seta r_ext_compressed_textures "1"
seta r_ext_texture_filter_anisotropic "0"
seta com_maxfps "0"
seta cg_drawfps "0"                  // OFF in shipped builds. The counter is a
                                     // development readout, not a game feature, and a
                                     // release should not open with debug text on screen.
                                     // Turn it on per-session with /cg_drawfps 1.
// Rage-128-class HUD: 3D status-bar models render as garbage; use 2D icons.
seta cg_draw3dIcons "0"
seta cg_lagometer "0"
// cg_marks and r_ext_compiled_vertex_array are both CVAR_ARCHIVE and unset by
// any file here otherwise, so a stale value from a past bench session wins
// silently instead of what we ship. Assert the engine's own defaults. Issue #31.
seta cg_marks "1"
seta r_ext_compiled_vertex_array "1"
// Sound mixing is the biggest CPU cost on a 750 (scalar). 11025 Hz halves it.
seta s_sdlSpeed "11025"
// Native game modules: load the fat ppc cgame/qagame/ui dylibs bundled in the
// .app instead of JIT-compiling the pak8 QVM. dyld picks the no-AltiVec ppc750
// slice here. The G3 is fill/sound-bound so the CPU win is marginal, but it's
// free and consistent, and falls back to the QVM if a dylib is absent or on a
// pure server. See docs/PROFILING.md.
seta vm_cgame "0"
seta vm_game "0"
seta vm_ui "0"

// Re-test flare occlusion every 8th frame instead of every frame.
//
// Each flare visibility test is a 1-pixel glReadPixels of the depth buffer,
// which is a full GPU pipeline sync, and the FIRST one in a frame destroys
// CPU/GPU overlap for that whole frame. Thinning the tests within a frame does
// nothing (measured: capping 4 tests to 1 gave 24.7 vs 24.6 fps). Skipping
// whole frames is what pays.
//
// Measured on yosemite, demo four, 800x600 fullscreen:
//     interval 1 (upstream)   24.6 fps
//     interval 4              32.0 fps
//     interval 8              33.9 fps   <- shipped
//     flares off entirely     35.8 fps
//
// So this keeps the flares and recovers ~85% of what deleting them would buy.
// The only change is that a flare takes up to 8 frames to notice it has become
// occluded, against a fade r_flareFade already spreads over ~150ms.
seta r_flareTestInterval "8"
