// quad-g5 — Power Mac G5 Quad (PowerMac11,2, 4x PowerPC 970MP) / GeForce 6600
// 256 MB / Leopard 10.5.8. Runs the fat binary's ppc7400 slice, like every other
// G5.
//
// WHY THIS FILE EXISTS AT ALL
//
// Until now hw.model PowerMac11,2 had no entry in com_machineMap, so the fastest
// PowerPC machine in the fleet fell through to the per-arch baseline,
// autoexec-ppc7400.cfg. That baseline is deliberately tuned around the WEAKEST
// G4 GPU here, sawtooth's GeForce2 MX: r_picmip 1, r_subdivisions 8,
// r_lodbias 1. A quad G5 with a GeForce 6600 and 256 MB of VRAM was therefore
// running reduced-detail textures and coarse curves for no reason. Reported from
// hardware 2026-08-21, comparing a screenshot from this machine against the same
// map on the iMac G5, which does have its own config.
//
// Settings follow autoexec-imac-g5.cfg, which is bench-proven on a 970, with the
// GPU differences below.

// Use the DESKTOP's own resolution: it can never be out of range, because the
// monitor is displaying it right now. Same reasoning as the iMac G5 file.
seta r_mode "-2"
seta r_customwidth "1920"             // fallback only, if the capture fails
seta r_customheight "1080"
seta r_fullscreen "1"

seta r_picmip "0"                     // full-res textures. 256 MB VRAM, twice the
                                      // iMac G5's, so the baseline's picmip 1 was
                                      // costing detail this card never needed
seta r_texturebits "32"
seta r_colorbits "32"
seta r_depthbits "24"
seta r_vertexlight "0"
seta r_subdivisions "4"               // finer curves than the G4 baseline's 8
seta r_lodbias "0"                    // no model detail reduction
seta r_dynamiclight "1"
seta r_flares "1"
seta r_fastsky "0"
seta cg_shadows "1"

// Texture compression OFF, and this one is a suspected fix rather than a proven
// one, so it is worth being honest about.
//
// A wall band on this machine renders as one flat, saturated green with no
// detail at all, while the iMac G5 draws the same surface with its full arch
// ornament. Flat colour where a texture belongs is what a texture collapsed to
// its average looks like, and the obvious difference between the two machines is
// the GPU: a GeForce 6600 here against a Radeon 9600 there. This fleet already
// has one recorded NVIDIA-on-PowerPC driver defect, the GLSL path in QuakeSpasm
// that had to be gated off on exactly this class of card, so a compressed
// texture decoding wrongly on the same driver is a reasonable first suspect.
//
// Costs VRAM and nothing else, and there is plenty spare at 256 MB.
//
// NOT YET CONFIRMED on hardware. If the band is still flat with this set, the
// compressor is innocent and the next things to try are r_ext_texture_env_add
// and the shader's own stages, not more texture knobs.
seta r_ext_compressed_textures "0"

seta r_ext_texture_filter_anisotropic "1"
seta r_ext_max_anisotropy "8"
seta r_textureMode "GL_LINEAR_MIPMAP_LINEAR"  // trilinear

// FSAA left OFF pending a bench on this machine. The iMac G5 pays ~43% for 2x
// and can afford it because it has no fps floor. Nobody has measured the cost on
// a 6600 yet, and guessing a number into a shipped config is how the iMac G5
// header ended up carrying a figure that never reproduced.
seta r_ext_multisample "0"

// com_maxfps 125, NOT 0. Same reasoning as the arm64 baseline: the client keeps
// only CMD_BACKUP (64) usercmds, and CG_DrawDisconnect calls the link dead when
// the oldest one is newer than the server's last acknowledgement. A quad G5 is
// quick enough to wrap that ring faster than a round trip and flash "Connection
// Interrupted" on a healthy connection.
seta com_maxfps "125"
seta cg_drawfps "0"                  // OFF in shipped builds. Turn it on per
                                     // session with /cg_drawfps 1.
seta cg_lagometer "0"

// --- watchlink: Apple Watch "tactical computer" companion -----------------
// See autoexec-imac-g5.cfg for the rationale. Same port and service as the
// Quake 1 and Quake 2 ports.
seta watch_host "auto"
seta watch_port "27999"
