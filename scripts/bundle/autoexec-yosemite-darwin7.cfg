// yosemite on Panther 10.3.9 - G3 449 MHz / Rage 128 16 MB, darwin major 7.
//
// OS OVERLAY. Applied by Com_AutoConfigForMachine AFTER autoexec-ppc750.cfg and
// AFTER autoexec-yosemite.cfg, so it carries only what Panther wants DIFFERENTLY
// from the shared G3 profile. Do not copy autoexec-yosemite.cfg in here.
//
// This file is where Panther's headroom gets spent.
//
// The same Power Mac G3 runs about 1.6x faster on Panther than on its Tiger
// partition with an identical binary and config: 33.35 fps against 20.8-21.4,
// demo four at 800x600. Against the 20 fps floor that is roughly 67% of headroom
// on Panther and 4% on Tiger. The project rule is that above the floor effects
// beat frame rate, so the shared profile stays tuned for the partition that has
// almost nothing spare, and the spare on this one is spent here.
//
// Why is Tiger slower at all: issue #15, not answered.

// ---------------------------------------------------------------------------
// MEASURED COST OF THIS FILE: 33.35 -> 30.1 fps, about -9.7%.
//
// yosemite 10.3.9, demo four, 800x600 FULLSCREEN, three runs, median of runs 2
// and 3, all six settings applied together:
//     baseline  33.3 / 33.3 / 33.4   -> 33.35
//     with this 29.1 / 30.0 / 30.2   -> 30.1
//
// That leaves 30.1 against a 20 fps floor, still about 50% clear, so this is a
// deliberate trade of frame rate for looks and not a regression.
//
// NOTE THE DISAGREEMENT WITH THE SWEEP, because it matters for anyone reading
// benchmarks/sweep-yosemite-20260822-210515.csv. Every one of these six measured
// FREE there, inside noise of a 12.5 fps baseline. That sweep is WINDOWED
// (q3sweep.sh defaults Q3FS=0) and this port ships fullscreen. Windowed and
// fullscreen are different operating points on this driver and the sweep did not
// predict this cost. Treat that file as a price list for ranking knobs, never as
// a fullscreen result.
// ---------------------------------------------------------------------------

seta r_subdivisions "4"        // 12 in the shared profile. Smoother curved surfaces.
seta r_lodbias "0"             // 2 in the shared profile. Full model detail, no
                               // aggressive LOD popping on distant players.
seta r_lodCurveError "10000"   // 250 by default. Curves keep their tessellation
                               // much further from the camera.
seta r_textureMode "GL_LINEAR_MIPMAP_LINEAR"
                               // trilinear. The shared profile leaves the engine
                               // default, GL_LINEAR_MIPMAP_NEAREST, which is
                               // bilinear with a visible mip seam on floors.
seta r_detailtextures "1"      // the detail texture pass, off by default here.
seta cg_shadows "1"            // blob shadows under players and items. The shared
                               // profile sets 0.

// DELIBERATELY NOT SET, with the measured reason for each. All from the sweep
// above, so all windowed, but these three are far outside noise and the ranking
// is what that file is good for:
//
//     r_picmip 0         9.7 fps, -22%.  Full-resolution textures thrash 16 MB
//                                        of VRAM. autoexec-yosemite.cfg already
//                                        records picmip 0 as a VRAM trap here.
//     r_texturebits 32  10.1 fps, -19%.  Same cause.
//     cg_shadows 2       7.6 fps, -39%.  Stencil shadows. Much too expensive on
//                                        this part. Worth measuring separately
//                                        on the G4 and G5, which have headroom;
//                                        this number is not a PowerPC-wide no.
//
// r_colorbits 32 measured free in the sweep and is NOT set here on purpose. The
// shipping profile pins 16-bit colour and depth, and this machine reports
// PIXELFORMAT color(16-bits) Z(16-bit). A setting the driver silently declines
// costs nothing and does nothing, which is the same shape as
// r_ext_compressed_textures on this card. Not shipped on an unconfirmed reading.
