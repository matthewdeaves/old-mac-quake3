// yosemite on Tiger 10.4.11 - G3 449 MHz / Rage 128 16 MB, darwin major 8.
//
// THIS FILE IS AN OS OVERLAY, not a machine profile. It is applied by
// Com_AutoConfigForMachine (code/qcommon/common.c) AFTER autoexec-ppc750.cfg
// and AFTER autoexec-yosemite.cfg, so it only has to carry the settings where
// this machine's Tiger partition wants a different answer from its Panther one.
// Everything else is inherited. Do not copy autoexec-yosemite.cfg in here.
//
// Why the file exists at all. yosemite is one Power Mac G3 with two boot
// partitions, 10.3.9 and 10.4.11. hw.model is identical on both, so the
// per-machine layer cannot tell them apart, and until this layer existed the G3
// was pinned to whichever OS was worse for each knob. The naming is
// <machine>-darwin<major>, from kern.osrelease: 7 = Panther, 8 = Tiger,
// 9 = Leopard, 11 = Lion. There is deliberately no autoexec-yosemite-darwin7
// file: Panther is what autoexec-yosemite.cfg is already tuned for, and an
// absent overlay is a silent no-op.
//
// The two partitions were about 1.6x apart in fps on that identical binary and
// config, at the time this file was written (issue #15) - since then the
// r_primitives revert below (#26) and controlling the cvars that had drifted
// between the partitions (docs/PROFILING.md, "Tiger-side re-baseline under the
// converged config") closed most of that gap; it was mostly measurement drift,
// not a real OS/driver difference. What still matters for tuning is the
// consequence: Panther's shipped config spends its floor headroom on the
// quality overlay above (autoexec-yosemite-darwin7.cfg), and Tiger's does not
// carry the same headroom to spend, so Tiger's settings stay chosen for fps.

// r_primitives 2, against the 3 that autoexec-yosemite.cfg pins for Panther.
//
// This is the setting that forced the OS layer to be built, and it was already
// measured before the layer existed (docs/PROFILING.md, "G3 on both OSes").
// Same machine, same binary, same config, demo four, 800x600:
//
//                      Panther     Tiger
//     r_primitives 3     33.35     20.80
//     r_primitives 2     31.70     21.40
//
// So 3 is right on Panther by ~5.2% and wrong on Tiger by ~2.9%, and on Tiger
// that 2.9% is most of the entire margin that exists over the floor. The knob
// selects the vertex submission path: 3 is immediate mode, 2 is a single
// glDrawElements. Apple's Rage 128 driver changed between 10.3.9 and 10.4.11 in
// a way that reverses which one wins; the reasoning for 3 on Panther, and why
// this must not be copied to the G4 or G5, is in autoexec-yosemite.cfg.
seta r_primitives "2"
