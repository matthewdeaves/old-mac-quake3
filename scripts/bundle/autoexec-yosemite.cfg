// yosemite — G3 449 MHz / Rage 128 16 MB / Panther 10.3.9
// Tuned from bench evidence (2026-06-29). Goal: the PRETTIEST G3 build that
// still clears the >=20 fps floor. The user wants the map's real shader work
// back — lit/animated wall surfaces, portals, flares — which the old "survival"
// config (r_vertexlight 1) had collapsed away. So we drop to 800x600 to buy the
// fill budget for full shaders + lightmaps. See docs/KNOBS.md + PROFILING.md.
//
// Bench (demo four, 800x600, effects ON): picmip 1 = 22.1 fps (ships), picmip 0
// = 19.5 (just under floor + VRAM thrash). At 1024x768 effects-on is only 15.9.
// Texture A/B @1024 (effects off): picmip 3=28.2, 1=27.0, 0=20.8 (0 thrashes the
// 16 MB VRAM — no S3TC on the Rage 128). Sound: s_sdlSpeed 11025 (below).
// DELIBERATELY not r_mode -2. Every other machine in this port takes the
// desktop's own resolution, which can never be out of range. The G3 cannot
// afford it: this part is fill-bound and the cost is close to linear in pixel
// count. Measured on yosemite, demo four, 2026-08-20:
//     640x480    20.8 fps
//     800x600    13.8 fps   <- shipped
//     1024x768    4.4 fps
// So if the desktop happens to be 1024x768, mode -2 would hand this machine a
// slideshow. A fixed, known-playable size is the right trade here and nowhere
// else.
seta r_mode "-1"
seta r_customwidth "800"             // 800x600 buys the fill budget for the
seta r_customheight "600"            // real shader/lightmap effects (vs 1024).
seta r_fullscreen "1"
seta r_picmip "1"                    // half-res textures; picmip 0 thrashes VRAM
seta r_texturebits "16"              // keep 16-bit: 16 MB VRAM is the real limit
seta r_colorbits "16"
seta r_depthbits "16"
seta r_vertexlight "0"               // LIGHTMAPS + full multi-stage shaders:
                                     // restores lit/animated walls, portals, etc
                                     // (r_vertexlight 1 collapsed them to 1 flat
                                     // stage — that was the "basic" look).
// r_primitives 3, which the engine will NEVER choose on its own, and which is
// the wrong answer on every other machine in this fleet.
//
// 3 is the immediate-mode path, glColor4ubv + glTexCoord2fv + glVertex3fv per
// vertex. Auto-select (0) only ever resolves to 2 (single glDrawElements) when
// GL_EXT_compiled_vertex_array is present, else 1 (glArrayElement). The Rage
// 128 driver reports CVA, so a fresh install here picks 2 and is slower.
//
// Measured 2026-08-21, yosemite 10.3.9, demo four, 800x600, shipping profile,
// 3 runs each, median of runs 2 and 3, and every run verified against the
// engine's own "rendering primitives:" line so a setting that did not take
// could not be scored:
//
//     r_primitives 3   33.3 fps    <- immediate mode
//     r_primitives 2   31.7 fps       single glDrawElements
//     r_primitives 1   31.3 fps       multiple glArrayElement
//
// Same A/B on mini-g4 (Radeon 9200, 10.4.11, demo four, 1024x768) goes the
// OTHER way, and by far more:
//
//     r_primitives 3   57.3 fps
//     r_primitives 2   74.6 fps    <- +30%
//
// So this is a per-GPU answer, not a PowerPC one, and it must not be copied to
// the G4 or G5 profiles. Apple's Rage 128 driver is the outlier: on it the
// vertex-array paths are slower than feeding vertices one at a time. Issue #7.
seta r_primitives "3"

seta r_subdivisions "12"             // a bit smoother curves now we have lightmaps
seta r_lodbias "2"                   // aggressive model LOD (keep — fps is tight)
seta r_dynamiclight "1"              // dynamic lights (rocket/plasma glow) back on
seta r_flares "1"                    // light flares back on
seta r_fastsky "0"                   // REAL sky. Not 1 and not 2, and the history matters.
                                     //
                                     // 1 switches portals off outright: tr_main.c:969 gates them
                                     // on an EXACT r_fastsky->integer == 1. 2 was then chosen to
                                     // dodge that gate while keeping the fill saving, since both
                                     // saving paths (tr_backend.c:448, tr_sky.c:799) are truthy
                                     // tests. That restored the portal but left it BLACK, because
                                     // the same truthy test at tr_backend.c:448 clears the colour
                                     // buffer to black for every view including the portal's.
                                     // Seen on hardware: the q3dm0 mirror was a black rectangle.
                                     //
                                     // And the saving does not exist. Measured on yosemite, demo
                                     // four, 800x600, 2026-08-20:
                                     //     r_fastsky 2  13.7 fps, mirrors black
                                     //     r_fastsky 0  13.9 fps, mirrors correct
                                     // Real sky is if anything FASTER. The Rage 128 is not bound
                                     // by sky fill here, so the cheap sky bought nothing and cost
                                     // every reflection in the game. Issue #6.
seta cg_shadows "0"
seta r_ext_compressed_textures "1"   // critical on 16 MB VRAM
seta r_ext_texture_filter_anisotropic "0"
seta com_maxfps "0"
seta cg_drawfps "0"                  // OFF in shipped builds. The counter is a
                                     // development readout, not a game feature, and a
                                     // release should not open with debug text on screen.
                                     // Turn it on per-session with /cg_drawfps 1.
// --- HUD correctness on the Rage 128 (2026-06-29) ----------------------------
// The Q3 status bar draws three actual 3D MD3 models into tiny HUD viewports
// (ammo, player head, spinning armor — cg_draw.c CG_DrawStatusBar). On the
// Rage 128's ancient GL these render as garbage smudges. cg_draw3dIcons 0 makes
// the HUD use the engine's flat 2D-icon fallback (CG_DrawPic) instead — correct
// AND cheaper (no model render). cg_lagometer 0 removes the corrupted net-graph
// block in the bottom-right corner. Together they FIXED the HUD and raised fps.
seta cg_draw3dIcons "0"
seta cg_lagometer "0"
// --- Sound mix cost (2026-06-29) -------------------------------------------
// Profiling (docs/PROFILING.md) showed sound mixing was ~29% of the G3 frame
// time — the single biggest CPU cost, scalar (no AltiVec on a 750). The SDL
// backend's rate is s_sdlSpeed (NOT s_khz); 11025 Hz halves the mix work.
// Measured (demo four, 640x480, via .app): 22050 -> 47.7 fps, 11025 -> 54.6 fps,
// sound off -> 61.0 fps. Must be set before sound init — the bundle auto-config
// execs this before CL_Init, so it takes effect for the launch.
seta s_sdlSpeed "11025"
// --- watchlink: Apple Watch "tactical computer" companion -----------------
// Auto-discover the iPhone/Watch companion over Bonjour and stream live vitals
// (health / armor / ammo / weapon / score / powerups) by UDP. Fully inert if
// no companion is found. Shared port + service with the Quake 1 / Quake 2 ports.
seta watch_host "auto"
seta watch_port "27999"

// Re-test flare occlusion every 8th frame instead of every frame.
//
// Each flare visibility test is a 1-pixel glReadPixels of the depth buffer,
// which is a full GPU pipeline sync, and the FIRST one in a frame destroys
// CPU/GPU overlap for that whole frame. Thinning the tests within a frame does
// nothing (measured: capping 4 tests to 1 gave 24.7 vs 24.6 fps). Skipping
// whole frames is what pays.
//
// Measured on yosemite, demo four, 800x600 fullscreen:
//     interval 1 (upstream)   24.6 fps
//     interval 4              32.0 fps
//     interval 8              33.9 fps   <- shipped
//     flares off entirely     35.8 fps
//
// So this keeps the flares and recovers ~85% of what deleting them would buy.
// The only change is that a flare takes up to 8 frames to notice it has become
// occluded, against a fade r_flareFade already spreads over ~150ms.
seta r_flareTestInterval "8"
