# Quake III's config for the shared deploy-dmg.sh / smoke-dmg.sh
# (old-mac-build-host#96). This file is ours and is never synced; the two
# scripts are buildhost's and are synced byte-identical. Variables are
# documented at the top of both scripts.

PORT=quake3
DMG_PREFIX=ioquake3-OldMac-
IMAGE_ROOT=.
INSTALL_DIR=/Applications/Quake3

# The DMG's top level: the app, the quarantine helper and the readme. The loose
# bench binary and libSDL are pulled out of the verified bundle by post_stage,
# for bench.sh (issue #10: named ioquake3-bench so Finder shows no second app).
OWNED=(ioquake3.app 'Fix Launch Problems.command?' 'fix-support?' 'README.txt?' 'ioquake3-bench?' 'libSDL-1.2.0.dylib?')
VERIFY=(ioquake3.app/Contents/MacOS/ioquake3 ioquake3.app/Contents/MacOS/libSDL-1.2.0.dylib)
REMOTE_POST_STAGE='cp -p ioquake3.app/Contents/MacOS/ioquake3 ioquake3-bench && chmod +x ioquake3-bench && cp -p ioquake3.app/Contents/MacOS/libSDL-1.2.0.dylib libSDL-1.2.0.dylib'

# baseq3/ holds the player's paks, q3config.cfg and screenshots: never touched.
# qkey (the CD key) sits in the install root and is not OWNED, so it stays too.
DATA_DIR=baseq3

# Smoke: a production launch (bundled auto-config on) that runs timedemo four
# and quits itself via nextdemo. fs_basepath is NOT forced: the engine must
# find its own install from the binary's path, as a double-click does.
PROC=ioquake3
SMOKE_DEMO=four
SMOKE_ARGS=(+set fs_homepath '{DEST}' +set logfile 2 +set nextdemo quit +set timedemo 1 +demo '{DEMO}')
SMOKE_LOG=baseq3/qconsole.log
PASS_RE='frames.*seconds.*fps'
FAIL_RE='ERROR:'
# Never KILL a fullscreen ioquake3: it wedges the GPU driver (docs/adr/0009).
KILL_OK=no
# timedemo four end to end, measured 2026-09-23 (smoke-dmg, production config):
# G3 67 s at 18.8 fps plus ~30 s start, G4 ~26 s, G5 ~11 s, GMA 950 31 s.
SMOKE_TIMEOUT_ppc750=240
SMOKE_TIMEOUT_ppc7400=180
SMOKE_TIMEOUT_ppc7450=180
SMOKE_TIMEOUT_ppc970=120
SMOKE_TIMEOUT=90
