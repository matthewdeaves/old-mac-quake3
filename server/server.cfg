// Quake III Arena dedicated server configuration.
//
// This file has to live in the GAME directory, as baseq3/server.cfg, and it is
// read because the launch line says +exec server.cfg. Quake III's exec searches
// the game directory, not the directory ioq3ded sits in, so a copy left beside
// the binary is silently never read.

// ---------------------------------------------------------------- identity
set sv_hostname "Quake III Arena"
set sv_maxclients 8

// Shown to a connecting player on the loading/info screen and as the
// scoreboard title (code/cgame/cg_info.c, cg_scoreboard.c), blank by
// default. Live: rcon set g_motd "..." takes effect immediately, no
// map_restart needed - it is just a configstring (CS_MOTD).
set g_motd ""

// ----------------------------------------------------------------- privacy
//
// Quake III has no sv_public cvar. Listing is decided by the value of
// `dedicated` itself, which is on the command line in the systemd unit:
//
//     dedicated 1   private. Runs a normal internet server and accepts
//                   connections from anywhere, but sends no heartbeats, so it
//                   appears in no public server browser.
//     dedicated 2   public. Announces to sv_master1..5.
//
// The unit ships `dedicated 1`. Note this is NOT the same as Half-Life's
// sv_lan 1, which actively refuses non-local addresses. Quake III's
// `dedicated 1` restricts advertising only, never who may connect.
//
// Blank the masters too, so an accidental `dedicated 2` still tells nobody.
set sv_master1 ""
set sv_master2 ""
set sv_master3 ""
set sv_master4 ""
set sv_master5 ""

// A joining player must supply this. Read by the game code, so it applies to
// everyone who is not using a reserved slot below. Live: rcon set g_password
// "..." works, existing connections are unaffected, only new joins are
// checked. g_needpass (whether a password is currently required) is derived
// from this automatically (code/game/g_main.c) and is CVAR_ROM - it cannot be
// set directly, do not try.
set g_password ""

// Reserved slots, for getting in when the server is full. Clients set
// `password` to sv_privatePassword to claim one.
set sv_privateClients 0
set sv_privatePassword ""

// Remote admin. With this set you can change map from inside the game, see
// README.md. Leave empty to disable rcon. The password crosses the network in
// the clear, so make it long, random, and used nowhere else.
set rconPassword ""

// -------------------------------------------------------------- match rules
// 0 FFA, 1 tournament, 2 single player (not for a dedicated server), 3 team
// DM, 4 CTF. Do NOT set 5 (One Flag CTF), 6 (Overload) or 7 (Harvester) on
// this build - their game logic is compiled out (BUILD_MISSIONPACK=0, see
// README.md's "Game types" section), so the match would select but not
// actually play.
set g_gametype 0
set timelimit 15
set fraglimit 20
set g_inactivity 0        // 0 never kick an idle player

// ----------------------------------------------------------------- the bots
// Quake III has bots built in, which is worth knowing on a server that mostly
// has two people on it. g_spSkill is 1 to 5.
set bot_enable 1
set g_spSkill 3

// ------------------------------------------------------------------ comfort
// Ping-based rejection, off. These default to values that can refuse a player
// on a slow link, which is the last thing wanted here.
set sv_minPing 0
set sv_maxPing 0

// Bandwidth ceiling per client, bytes/sec.
set sv_maxRate 25000

// ------------------------------------------------------- attack surface
//
// Downloads push server content OUT to connecting clients. Both of our clients
// already carry the same paks the server does, so leaving this on only ever
// serves a stranger.
set sv_allowDownload 0

// Flood protection on client commands, on by default and worth keeping.
set sv_floodProtect 1

// Pure means clients must be running the same paks as the server. Our clients
// install from the same release, so this costs nothing and stops a modified
// client joining.
set sv_pure 1

// -------------------------------------------- tuning for the old Mac clients
//
// sv_fps stays at the default 20. Raising it costs bandwidth and asks the
// client for work, and the oldest machine that will connect here is fill-rate
// bound long before it is network bound.
set sv_fps 20

// ------------------------------------------------------------- map rotation
// Quake III has no maplist cvar. Rotation is done by chaining configs: each
// map's own vstr sets the next one. This is the standard idiom.
set d1 "map q3dm1  ; set nextmap vstr d2"
set d2 "map q3dm7  ; set nextmap vstr d3"
set d3 "map q3dm17 ; set nextmap vstr d4"
set d4 "map q3tourney2 ; set nextmap vstr d1"
vstr d1
